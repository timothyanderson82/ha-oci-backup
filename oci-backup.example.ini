# Copy to oci-backup.ini (git-ignored) and fill in. Used by scripts/oci_smoke_test.py.
# These are the same values the Home Assistant setup form asks for.
[oci]
# Object Storage namespace: `oci os ns get`, or the bucket details page
namespace =
# OCI region identifier of the bucket
region = af-johannesburg-1
bucket = ha-backups
# Customer Secret Key (Profile -> User settings -> Customer secret keys)
access_key_id =
secret_access_key =
# Optional folder inside the bucket
prefix =
